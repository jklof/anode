name: anode-dev

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - pytest

  # ---- PyTorch stack ----
  - pytorch
  - torchaudio

  # ---- Everything else ----
  # Only dependencies actually imported by the app / plugins.
  # (scipy, librosa, and pip TTS/ASR extras were removed as unused —
  # re-add if you need them for local experiments.)
  - cmake
  - cxx-compiler
  - numpy
  - resampy
  - av
  - pysoundfile
  - yt-dlp
  - pyside6

  - pip:
      - sounddevice
      - mido
      - python-rtmidi
      - onnxruntime
      - swift-f0
      - pylibrb
