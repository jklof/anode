name: anode-dev

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - pytest

  # ---- PyTorch stack (must come from pytorch channel) ----
  - pytorch
  - torchaudio
  - pytorch-cuda=12.1

  # ---- Everything else ----
  # Only dependencies actually imported by the app / plugins.
  # (scipy, librosa, onnxruntime, mido and the pip TTS/ASR extras were
  # removed as unused — re-add if you need them for local experiments.)
  - cmake
  - cxx-compiler
  - numpy
  - resampy
  - av
  - pysoundfile
  - yt-dlp
  - pyside6

  - pip:
      - sounddevice
